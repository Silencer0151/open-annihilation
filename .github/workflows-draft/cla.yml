# Draft: CLA Assistant for the engine repository, to be enabled when it goes
# live. Contributors sign CLA.md once by commenting on their first pull
# request; signatures are kept in signatures/cla.json on the cla-signatures
# branch, which only this workflow writes. Needs a repository secret
# CLA_SIGNATURES_TOKEN (a token that can push to that branch) and the
# cla-signatures branch created empty before the first run.
#
# The job never checks out or runs pull-request code. The workflow grants
# nothing by default; the job gets only the permissions the action documents
# for signatures kept in this repository. The action is pinned by commit,
# which the comment beside it names by release tag.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions: {}
jobs:
  cla:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/open-annihilation/open-annihilation/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please read the
            [Contributor Licence Agreement](https://github.com/open-annihilation/open-annihilation/blob/main/CLA.md)
            and sign it by commenting on this pull request with the sentence below.
          custom-allsigned-prcomment: All contributors have signed the CLA.
          lock-pullrequest-aftermerge: false
